network = "registries"

[[rule]]
name = "secrets never merge"
match = { added = "AKIA[0-9A-Z]{16}|-----BEGIN ((RSA|EC|DSA|OPENSSH|PGP) )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36}|sk_live_[0-9A-Za-z]{24}|xox[baprs]-[0-9A-Za-z-]{10,}" }
policy = "block"

[[rule]]
name = "agent skills and instructions wait for a person"
match = { path = "(^|/)(AGENTS|CLAUDE)\\.md$|^\\.mcp\\.json$|^\\.(agents|claude|cursor|codex)/" }
policy = "human-review"
protected = true

[[rule]]
name = "dependency bots' settings wait for a person"
match = { path = "^(renovate\\.json5?|\\.renovaterc(\\.json5?)?|\\.(github|gitlab)/renovate\\.json5?|\\.github/dependabot\\.ya?ml)$" }
policy = "human-review"
protected = true

[[rule]]
name = "GitHub workflows wait for a person"
match = { path = "^\\.github/" }
policy = "human-review"
protected = true

[[rule]]
name = "docs merge on their own"
match = { path = "(^|/)(docs?|documentation)/|\\.(md|mdx|rst|adoc)$" }
policy = "auto-merge"

[[rule]]
name = "tests merge once the checks pass"
match = { path = "(^|/)(tests?|__tests__|spec)/|\\.(test|spec)\\.[cm]?[jt]sx?$" }
policy = "auto-merge"

[[check]]
name = "GitHub checks"
github = "*"
timeout = "30m"
